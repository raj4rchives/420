<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Syllabus Tracker Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card">
<h1>JEE SYLLABUS TRACKER</h1>
<p class="sub">Offline Printable • Tick everything by hand</p>

<div class="grid">
<div>
<label>SUBJECT</label>
<select id="subject">
<option>PHYSICS</option>
<option>CHEMISTRY</option>
<option>MATHEMATICS</option>
</select>
</div>
<div>
<label>CHAPTER NAME</label>
<input id="chapter" placeholder="e.g. Ray OPTICS">
</div>
<div>
<label>TOTAL LEC</label>
<input id="lectures" type="number" min="1" max="100" value="5">
</div>
<div>
<label>MAINS LEVEL</label>
<select id="mains"><option>□</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
</div>
<div>
<label>ADV LEVEL</label>
<select id="adv"><option>□</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
</div>
<div>
<label>TRACKING ITEMS</label>
<div class="options">
<label><input type="checkbox" value="SHORT NOTES" checked> SHORT NOTES</label>
<label><input type="checkbox" value="DPP" checked> DPP</label>
<label><input type="checkbox" value="HW" checked> HW</label>
<label><input type="checkbox" value="MODULE" checked> MODULE</label>
<label><input type="checkbox" value="PYQ" checked> PYQ</label>
<label><input type="checkbox" value="TEST" checked> TEST</label>
<label><input type="checkbox" value="R1" checked> R1</label>
<label><input type="checkbox" value="R2" checked> R2</label>
<label><input type="checkbox" value="R3" checked> R3</label>
</div>
</div>
</div>

<div class="buttons">
<button onclick="addChapter()">+ ADD CHAPTER</button>
<button onclick="generatePreview()" class="secondary">PREVIEW</button>
<button onclick="downloadPDF()">DOWNLOAD PDF</button>
<button onclick="clearAll()" class="danger">CLEAR ALL</button>
</div>

<div class="chapter-list" id="chapterList"></div>
<div id="preview"></div>
<p class="footer-note">PDF is designed for A4 landscape printing with dark black borders and headers.</p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
